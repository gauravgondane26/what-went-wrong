<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- BrandMark (components/Shell/AppHeader.tsx) with the tokens.css colours inlined:
       a defensive shape with one side broken open. Keep the two in sync. -->
  <style>
    .def { fill: none; stroke: #1d5fd0; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .gap { stroke: #c4261b; stroke-width: 2.2; stroke-linecap: round; }
    .dot { fill: #171717; }
    /* The ink dot would vanish on a dark browser tab; the blue and red stay readable. */
    @media (prefers-color-scheme: dark) {
      .dot { fill: #f5f5f5; }
    }
  </style>
  <path class="def" d="M5 7.5 12 3l7 4.5" />
  <path class="def" d="M19 7.5v8.5L12 21 5 16V7.5" />
  <path class="gap" d="M19 12.5 21.5 11" />
  <circle class="dot" cx="12" cy="12" r="2.2" />
</svg>
