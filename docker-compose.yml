# Local stack: the containerised API plus the Vite dev server.
#   docker compose up --build      → app on http://localhost:5173, API on :8081
# Production is unchanged: Render runs backend/Dockerfile, Netlify serves the
# frontend build.
#
# To read StatsBomb data from a local clone of statsbomb/open-data instead of
# GitHub, add a docker-compose.override.yml (compose loads it automatically):
#   services:
#     backend:
#       environment: { STATSBOMB_LOCAL_PATH: /data }
#       volumes: ["C:/path/to/open-data/data:/data:ro"]

services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      CORS_ORIGINS: http://localhost:5173

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8081
      CHOKIDAR_USEPOLLING: "true"   # file watching across a Windows bind mount
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # keep Linux deps apart from the host's
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
